<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Thank You</title>

<link rel="stylesheet" href="styles.css">

<meta http-equiv="refresh" content="8; url=index.html">

<style>

body{

display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;

}

.box{

padding:40px;
border-radius:20px;
background:rgba(15,15,20,.8);
backdrop-filter:blur(12px);

}

.count{

color:#00d4ff;
font-size:18px;
margin-top:20px;

}

.home-btn{

display:inline-block;
margin-top:22px;
padding:12px 26px;
border-radius:999px;
background:linear-gradient(135deg,#00d4ff,#5f8df7);
color:#ffffff;
font-weight:700;
text-decoration:none;
box-shadow:0 12px 28px rgba(0,212,255,.24);
transition:transform .2s ease,box-shadow .2s ease;

}

.home-btn:hover{

transform:translateY(-2px);
box-shadow:0 16px 34px rgba(0,212,255,.32);

}

</style>

</head>

<body>

    <div class="box">
    
        <h1>✅ Thank You!</h1>
        
        <p>Your message has been sent successfully.</p>
        
        <p>You will automatically return to the homepage in</p>
        
        <h2 id="timer">8</h2>
        
        <p class="count">seconds...</p>

        <a class="home-btn" href="index.html">Back to Home</a>
    
    </div>
    
    <script>
    
        let time=8;
        
        const timer=document.getElementById("timer");
        
        setInterval(()=>{
        
        time--;
        
        timer.innerHTML=time;
        
        if(time<=0){
        
        window.location="index.html";
        
        }
        
        },1000);

</script>

</body>

</html>
